<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>授权管理</title><link rel="stylesheet" href="/admin/style.css"></head><body><main><header><div><small>LICENSE CONSOLE</small><h1>授权管理</h1><p>创建许可证、管理设备占用与授权状态</p></div><button id="logout" class="ghost">退出</button></header><section id="login" class="card login"><h2>管理身份验证</h2><input id="token" type="password" placeholder="输入 LICENSE_ADMIN_TOKEN"><button id="loginBtn">进入后台</button><p id="loginError" class="error"></p></section><div id="console" hidden><section class="card create"><h2>创建授权码</h2><div class="grid"><label>有效期<input id="expires" type="date"></label><label>设备数量<input id="devices" type="number" min="1" max="100" value="1"></label></div><button id="createBtn">生成授权码</button><div id="created" class="created" hidden><span>授权码仅显示这一次</span><code id="newKey"></code><button id="copyBtn" class="ghost">复制</button></div></section><section class="card"><div class="section-head"><h2>授权列表</h2><button id="refresh" class="ghost">刷新</button></div><div id="licenses" class="list"></div></section></div></main><script src="/admin/app.js"></script></body></html>
